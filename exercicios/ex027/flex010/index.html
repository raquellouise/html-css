<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.conteiner {
            background-color: gray;

            display: flex;
            flex-flow: row nowrap;
        }

        div.item {
            background-color: lightcoral;
            border: 1px solid rgb(114, 53, 31);
            text-align: center;
            flex-basis: 50px;
            flex-shrink: 1;
            flex-grow: 1;
        }

        div#a {
            flex-shrink: 0;
            flex-grow: 0;
        }

        div#b {
            flex-shrink: 1;
            flex-grow: 3;
        }

        div#c {
            flex-shrink: 0;
            flex-grow: 3;
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item" id="a">A</div>
        <div class="item" id="b">B</div>
        <div class="item" id="c">C</div>
    </div>
</body>
</html>
