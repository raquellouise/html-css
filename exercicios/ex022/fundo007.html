<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alinhamento vertical</title>
</head>
<style>
    #container {
        background-image: url(imagens/target001.png);
        background-size: 100% 100%;

        position: relative;
        height: 92vh;
        background-color: rgb(114, 82, 67);
        padding: 10px;
    }

    #conteudo {
        background-image: url(imagens/target001.png);
        background-size: 100% 100%;

        position: absolute;
        height: 200px;
        width: 400px;
        background-color: rgb(96, 123, 123);

        left: 50%;
        top: 50%;

        transform: translate(-50%, -50%);
        
    }
</style>
<body>
    <section id="container">
        <article id="conteudo">

        </article>
    </section>
</body>
</html>
